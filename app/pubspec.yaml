name: dashboard_app
description: Multi-role dashboard with Firebase authentication and role-based access control.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_messaging: ^15.2.10

  # State management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Routing & networking
  go_router: ^13.0.0
  dio: ^5.3.0

  # UI helpers
  cupertino_icons: ^1.0.8
  google_fonts: ^6.0.0
  lottie: ^2.6.0
  fl_chart: ^0.64.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  